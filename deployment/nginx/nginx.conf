user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    # Include conf.d
    include /etc/nginx/conf.d/*.conf;

    # Main Server Block
    server {
        listen 80;
        server_name localhost chaincarbon.com api.chaincarbon.com;

        # Redirect HTTP to HTTPS (Uncomment for Production)
        # location / {
        #     return 301 https://$host$request_uri;
        # }

        # For now, handle HTTP traffic
        location /api/ {
            proxy_pass http://backend:5000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # SSL Block (Placeholder)
    # server {
    #     listen 443 ssl http2;
    #     server_name chaincarbon.com;
    #     ssl_certificate /etc/letsencrypt/live/chaincarbon.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/chaincarbon.com/privkey.pem;
    #     ...
    # }
}
