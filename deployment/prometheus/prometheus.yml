global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'backend'
    scrape_interval: 5s
    # Backend needs to expose metrics at /metrics (prom-client)
    # If not implemented in code, this will fail scrape, but stack validates.
    # For portfolio, we demonstrate config.
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:5000']

  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
