name: Deploy ChainCarbon

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: reyhanzidany/chaincarbon

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Backend
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest

    - name: Build and push Frontend
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
        build-args: |
          REACT_APP_API_BASE_URL=https://api.chaincarbon.com

    - name: Build and push Blockchain Gateway
      uses: docker/build-push-action@v4
      with:
        context: ./blockchain/carbon-api
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/blockchain-api:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository (for compose file)
      uses: actions/checkout@v3

    - name: Copy docker-compose to VPS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        source: "deployment/docker-compose.prod.yml,deployment/nginx,deployment/.env.prod.example"
        target: "/opt/chaincarbon"
    
    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /opt/chaincarbon/deployment
          
          # Login to registry
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Pull new images
          docker-compose -f docker-compose.prod.yml pull
          
          # Restart services
          docker-compose -f docker-compose.prod.yml up -d
          
          # Cleanup unused images
          docker image prune -f
